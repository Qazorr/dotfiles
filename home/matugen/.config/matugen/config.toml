[config]

[templates.whatsapp]
input_path = '~/.config/matugen/templates/whatsapp.css'
output_path = '~/.local/share/pwa-theme/whatsapp.css'

[templates.teams]
input_path = '~/.config/matugen/templates/teams.css'
output_path = '~/.local/share/pwa-theme/teams.css'

[templates.sonora]
input_path = '~/.config/matugen/templates/sonora.json'
output_path = '~/.local/state/sonora-theme.json'
post_hook = '$HOME/.local/bin/sonora-theme'

[templates.outlook]
input_path = '~/.config/matugen/templates/outlook.css'
output_path = '~/.local/share/pwa-theme/outlook.css'

[templates.hypr-background]
input_path = '~/.config/matugen/templates/hypr-background.lua'
output_path = '~/.config/hypr/dms/background.lua'

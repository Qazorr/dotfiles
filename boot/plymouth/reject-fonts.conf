<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The initramfs hook ships the fonts as Plymouth*.ttf and fontconfig prefers
     them. The splash keeps that font list after it moves onto the real root,
     where the names don't exist, and text drawn from then on comes out as
     boxes. Fontconfig on the root must not see them, or the hook copies a link
     to itself. -->
<fontconfig>
  <selectfont><rejectfont><glob>/usr/share/fonts/Plymouth*.ttf</glob></rejectfont></selectfont>
</fontconfig>

if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod gfxterm
  terminal_output gfxterm
fi
set timeout=5
set default=0

menuentry 'Install Debian 13 + dotfiles' {
    linux    /install.amd/vmlinuz @BOOT_ARGS@ --- quiet
    initrd   /install.amd/initrd.gz
}

# Fully unattended: erases the FIRST DISK it finds without asking. For the test
# VM (vm/README.md), not for a machine with anything on it.
#
# The password below is public — it is in a git repo and on every copy of the
# ISO. Change it on any machine that is not a throwaway.

d-i preseed/include string preseed.cfg

d-i passwd/user-fullname string Kacper
d-i passwd/username string kacper
d-i passwd/user-password password insecure
d-i passwd/user-password-again password insecure
d-i user-setup/allow-password-weak boolean true

# One ext4 root, no LVM, no swap partition juggling. step_timeshift assumes a
# single non-btrfs root and picks rsync mode off the back of it.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/vda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Answers the boring half of the Debian installer: locale, keymap, mirror,
# timezone, packages. Left interactive on purpose — partitioning and the
# target disk (no boot entry should be able to erase the wrong one),
# username/password, hostname, and the network step, so WiFi can be picked.

d-i debian-installer/locale string en_US.UTF-8
# Matches hypr/.config/hypr/conf.d/input.conf's kb_layout, so the installer
# and the installed session agree.
d-i keyboard-configuration/xkb-keymap select us
# choose_interface is deliberately NOT preseeded: "select auto" skips the
# interface list when there's more than one NIC and picks one with link.
# On a laptop with an empty ethernet port that means the wired NIC wins,
# DHCP fails, and the wireless card is never offered — "network
# autoconfiguration failed" with no ESSID prompt. Letting it ask is what
# makes WiFi installable.
# Hostname isn't preseeded either — it should differ per machine, and the
# installer asks for it on its own. get_domain stays answered (empty) so it
# doesn't prompt for something there's no answer to on a home network.
d-i netcfg/get_domain string

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Warsaw
d-i clock-setup/ntp boolean true

# No root password; the first user gets sudo, which is what bootstrap.sh
# expects (it refuses to run as root).
d-i passwd/root-login boolean false

# No desktop task. This setup provides its own Hyprland session, and a
# preinstalled DE just gets in the way — same reasoning as vm/README.md.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string git sudo
d-i pkgsel/upgrade select full-upgrade
# Nothing to scan: this is a netinst and everything else comes off the mirror.
d-i apt-setup/cdrom/set-first boolean false
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i finish-install/reboot_in_progress note

# Put the repo in place. It rides on the ISO as a git bundle, so this needs no
# network and no credentials — which is the point, the repo is private.
# No -b: the clone follows the bundle's own HEAD, so the ISO ships whatever
# branch was checked out at build time rather than a hardcoded one.
# bootstrap.sh is deliberately NOT run here: it has to run as the normal user
# in a real login session, and it takes half an hour.
d-i preseed/late_command string \
    cp /cdrom/dotfiles.bundle /target/tmp/dotfiles.bundle; \
    in-target sh -c 'u=$(getent passwd 1000 | cut -d: -f1); \
        git clone /tmp/dotfiles.bundle /home/$u/dotfiles; \
        git -C /home/$u/dotfiles remote set-url origin git@github.com:Qazorr/dotfiles.git; \
        chown -R $u:$u /home/$u/dotfiles; \
        rm -f /tmp/dotfiles.bundle; \
        printf "\nThis machine was installed from the dotfiles ISO.\nRun:  cd ~/dotfiles && ./bootstrap.sh\n\n" > /etc/motd'

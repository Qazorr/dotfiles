name: Build ISO

# Runs iso/build.sh on a Linux runner (no Windows/macOS xorriso build) — see
# iso/README.md. Manual only: slow and bandwidth-heavy.
#
#   gh workflow run build-iso.yml --ref <branch>
#   gh run download --name debian-dotfiles-iso

on:
  workflow_dispatch:
    inputs:
      debian_version:
        description: "Debian point release (blank = iso/build.sh's own default)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xorriso
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Build the ISO
        env:
          DOTFILES_DEBIAN_VERSION: ${{ inputs.debian_version }}
        run: ./iso/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debian-dotfiles-iso
          # Not vm/iso/*.iso: build.sh also downloads the plain netinst
          # source into vm/iso/, and that glob would catch it too.
          path: vm/iso/*-dotfiles.iso
          retention-days: 14

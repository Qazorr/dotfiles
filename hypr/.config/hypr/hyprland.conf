# Kacper's Hyprland config — entry point.
# Actual config lives in conf.d/, split by concern so it's easy to iterate
# on one piece (e.g. keybinds) without wading through everything else.

# No monitor= lines in this repo: layout is per desk, in
# ~/.config/monitor-profiles/ (sourced below). With no profile matching,
# Hyprland's own default takes over — preferred mode, auto-arranged.
source = ~/.config/hypr/conf.d/environment.conf
source = ~/.config/hypr/conf.d/autostart.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/general.conf
source = ~/.config/hypr/conf.d/decoration.conf
source = ~/.config/hypr/conf.d/animations.conf
source = ~/.config/hypr/conf.d/workspaces.conf
source = ~/.config/hypr/conf.d/windowrules.conf
# Note: DMS's own keybind viewer can't read this hyprlang config (reports
# readOnly, no binds) — use `keybind-help` instead, which reads live from
# `hyprctl binds -j`.
source = ~/.config/hypr/conf.d/keybindings.conf

# The monitor profile for whichever desk this is: monitor= and workspace=
# rules, plus that desk's lid binds. `monitor-profile --watch` (autostart.conf)
# points active.conf at the match on login and on every hotplug. Outside the
# repo on purpose — EDID descriptions carry monitor serials. step_stow creates
# a placeholder, so this always resolves.
source = ~/.config/monitor-profiles/active.conf

# Machine-local, and last so it wins. Not tracked: it holds whatever is true
# of this specific box's hardware — the NVIDIA env block bootstrap.sh writes
# when it finds an NVIDIA card, for one. step_stow creates an empty one, so
# this source always resolves; a glob would not, Hyprland 0.55 errors with
# "found no match" when one matches nothing.
source = ~/.config/hypr/conf.d/local.conf

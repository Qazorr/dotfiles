# Entry point. Config lives in conf.d/, split by concern. Monitor layout is
# per desk in ~/.config/monitor-profiles/, sourced below.
source = ~/.config/hypr/conf.d/environment.conf
source = ~/.config/hypr/conf.d/autostart.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/general.conf
source = ~/.config/hypr/conf.d/decoration.conf
source = ~/.config/hypr/conf.d/animations.conf
source = ~/.config/hypr/conf.d/workspaces.conf
source = ~/.config/hypr/conf.d/windowrules.conf
# DMS's own keybind viewer can't read hyprlang (reports readOnly, no binds);
# `keybind-help` reads live from `hyprctl binds -j` instead.
source = ~/.config/hypr/conf.d/keybindings.conf

# The profile for whichever desk this is. Outside the repo: EDID descriptions
# carry monitor serials. step_stow leaves a placeholder so this always resolves.
source = ~/.config/monitor-profiles/active.conf

# Machine-local, last so it wins. step_stow creates an empty one so this
# always resolves; a glob would not — 0.55 errors "found no match".
source = ~/.config/hypr/conf.d/local.conf

# Hyprland options to switch while the screen is being shared, and put back
# after. Read by `screenshare`, not by Hyprland. Any name `hyprctl keyword`
# takes works; `exec-start` / `exec-stop` run a command instead. Preview the
# whole file with `screenshare test 5`.
#
# Colour options (general:col.*) don't survive the round trip — border_size
# covers borders instead.
decoration:blur:enabled = 0
animations:enabled = 0
general:border_size = 0
# Rendered in the border colours at range 3, so it reads as an outline.
decoration:shadow:enabled = 0

# Hyprland options to switch while the screen is being shared, and put back
# afterwards. Read by `screenshare` (scripts/.local/bin/screenshare), not by
# Hyprland — hyprland.conf does not source this file, and must not.
#
# Write options exactly as you would for `hyprctl keyword` or anywhere else in
# hyprland.conf, flattened to one line:
#
#     decoration:blur:enabled = 0
#     general:gaps_out        = 5 5 5 5
#
# Whatever the value is beforehand gets stored and restored, so this survives a
# themer moving it meanwhile. Anything hyprctl accepts works; check a name with
# `hyprctl getoption <name>`. Try the whole file for 5s with:
#
#     screenshare test 5

# Blur is the expensive one to encode and the first thing to smear under a
# call's compression. Off makes the share both cheaper and sharper.
decoration:blur:enabled = 0

# Animations re-encode large regions for motion the viewer sees as artefacts.
animations:enabled = 0

# Borders off. This also settles the border colours: with no border there is
# nothing to tint, which is just as well because colour options don't survive
# the round trip — hyprctl reports a gradient as `ffd0bcff ffccc2dc 45deg` and
# then refuses to parse that back, so never put col.* options in this file.
general:border_size = 0

# The shadow is what's left once the border is gone: decoration.conf renders it
# in the border colours at range 3, so it reads as a thin lavender outline
# rather than a drop shadow. Off, or the windows still look outlined.
decoration:shadow:enabled = 0

# Other options worth considering:
# decoration:rounding        = 0
# decoration:dim_inactive    = true
# general:gaps_out           = 5 5 5 5

# Two reserved names run a command instead of setting an option. Silencing
# notifications for the duration is the usual one.
# exec-start = dms ipc call notifications enableDoNotDisturbIndefinitely
# exec-stop  = dms ipc call notifications disableDoNotDisturb

# Hiding a window from viewers is NOT configured here — Hyprland does that
# natively with a no_screen_share window rule and no daemon at all. See the
# commented block in conf.d/windowrules.conf.

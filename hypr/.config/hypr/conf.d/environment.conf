# Hyprland does NOT inherit PATH from the login shell that exec'd it, so
# .zprofile is not enough — without this, `dms ipc call` keybinds and DMS's
# own lookups of dgop fail with "binary could not be found".
# Keep in sync with lib/paths.sh — ./bootstrap.sh --doctor checks.
env = PATH,$HOME/.local/share/dms/bin:$HOME/.local/share/uv/bin:$HOME/.local/share/krk-commute/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin

# So Qt/GTK/Firefox don't silently fall back to XWayland.
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Electron needs a launch flag, not an env var — see the `code` alias in
# zsh/.zshrc.

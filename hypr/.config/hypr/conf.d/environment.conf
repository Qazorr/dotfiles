# DMS's binaries (dms, dgop, dsearch, matugen) live outside the standard
# bin dirs, because ~/.local/bin is a stow symlink into the dotfiles repo.
# Hyprland does NOT inherit PATH from the login shell that exec'd it, so
# setting this in .zprofile is not enough: without this line, both the
# `dms ipc call ...` keybinds and DMS's own lookups of dgop/dms-blur fail
# with "binary could not be found".
env = PATH,$HOME/.local/share/dms/bin:$HOME/.local/share/uv/bin:$HOME/.local/share/krk-commute/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin

# Wayland-native toolkits, so Qt/GTK/Firefox apps don't silently fall back
# to XWayland.
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# VS Code/Electron need a --ozone-platform=wayland launch flag, not an env
# var, to run natively on Wayland — see the `code` alias in zsh/.zshrc.

# Hyprland 0.55 removed matcher support from hyprlang `windowrule`.
#
# Verified on 0.55.2: `windowrule = float on, class:^(x)$` is rejected with
# "invalid field class:^(x)$" — the same error a completely bogus field name
# produces — and even a bare `windowrule = float on` with no matcher at all
# has no effect on newly opened windows. `windowrulev2` reports
# "windowrulev2 is deprecated" and likewise does nothing. Rule matching moved
# to the Lua config (`hl.window_rule({ match = { class = ... } })`, see
# /usr/share/hypr/hyprland.lua).
#
# Everything this config used to rule on is launched from a keybind, so the
# rules moved into those exec lines as inline rules instead — Hyprland's exec
# dispatcher still honours `[float; size W H; center]`, which is verified
# working. See conf.d/keybindings.conf:
#
#   cava             SUPER+ALT+C     [float; size 640 360; center]
#   keybind-help     SUPER+SHIFT+/   [float; size 900 720; center]
#   nm-connection-editor  SUPER+ALT+N    [float; center]
#   blueman-manager  SUPER+ALT+B     [float; center]
#
# Rules for windows we don't launch ourselves — Picture-in-Picture, VS Code's
# quick-open popup, pavucontrol — have no hyprlang equivalent any more. They
# need the Lua config; left unimplemented rather than kept as dead lines that
# look like they work.

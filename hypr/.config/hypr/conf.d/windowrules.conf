# Hyprland 0.53+ syntax: matchers are `match:<prop>` fields. Find a window's
# class and title with `hyprctl clients`. Windows launched from a keybind can
# carry inline rules on the exec dispatcher instead — see keybindings.conf.
windowrule = match:title ^(.*MdfAvi.*)$, tag +mdf-tools
windowrule = match:title ^(.*MdfViewer.*)$, tag +mdf-tools
windowrule = match:title ^(.*BusViewer.*)$, tag +mdf-tools
windowrule = match:title ^(.*ProtocolDescriptionExplorer.*)$, tag +mdf-tools

windowrule {
  name = mdf-tools
  match:tag = mdf-tools
  float = true
}

windowrule {
  name = wireshark
  match:class = ^(.*Wireshark.*)$
  float = true
  rounding = 10
}

windowrule {
  name = file-managers
  match:class = ^(org.gnome.Nautilus|[Tt]hunar)$
  float = true
}

windowrule {
  name = vlc
  match:class = ^vlc$
  float = true
}

windowrule {
  name = pkgs
  match:class = ^pkgs$
  float = true
  size = monitor_w*0.75 monitor_h*0.85
  center = true
}

windowrule {
  name = whatsapp
  match:title = ^([Ww]hats[Aa]pp Web)$
  workspace = 9
}

windowrule {
  name = discord
  match:class = ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
  workspace = 9
}

windowrule {
  name = teams
  match:title = ^(Microsoft Teams.*)$
  workspace = 10
}

windowrule {
  name = outlook
  match:title = ^(.*Outlook.*)$
  workspace = 10
}


# Window rules, Hyprland 0.53+ syntax: matchers are `match:<prop>` fields.
# The pre-0.53 form (`windowrule = float, class:^(x)$`) is rejected with
# "invalid field", and `windowrulev2` is deprecated — see docs/reference.md.
# Find a window's class and title with `hyprctl clients`.
#
# Windows launched from a keybind can carry inline rules on the exec
# dispatcher instead (`[float; size 640 360; center]`) — see
# conf.d/keybindings.conf.

# --- Floating ---

# MDF tools: tagged by title, then floated as a group.
windowrule = match:title ^(.*MdfAvi.*)$, tag +mdf-tools
windowrule = match:title ^(.*MdfViewer.*)$, tag +mdf-tools
windowrule = match:title ^(.*BusViewer.*)$, tag +mdf-tools
windowrule = match:title ^(.*ProtocolDescriptionExplorer.*)$, tag +mdf-tools

windowrule {
  name = mdf-tools
  match:tag = mdf-tools
  float = true
}

windowrule {
  name = wireshark
  match:class = ^(.*Wireshark.*)$
  float = true
  rounding = 10
}

windowrule {
  name = file-managers
  match:class = ^(org.gnome.Nautilus|[Tt]hunar)$
  float = true
}

windowrule {
  name = vlc
  match:class = ^vlc$
  float = true
}

# --- Comms on fixed workspaces: 9 chat, 10 work ---

windowrule {
  name = whatsapp
  match:title = ^([Ww]hats[Aa]pp Web)$
  workspace = 9
}

windowrule {
  name = discord
  match:class = ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
  workspace = 9
}

windowrule {
  name = teams
  match:title = ^(Microsoft Teams.*)$
  workspace = 10
}

windowrule {
  name = outlook
  match:title = ^(.*Outlook.*)$
  workspace = 10
}

# Float common utility windows
windowrule = float on class:^(pavucontrol)$
windowrule = float on class:^(blueman-manager)$
windowrule = float on class:^(nm-connection-editor)$

# Picture-in-picture: float, stay on top, follow across workspaces
windowrule = float on title:^(Picture-in-Picture)$
windowrule = pin on title:^(Picture-in-Picture)$

# VS Code: tile normally, but quick-open/command-palette-style popups float
windowrule = float on class:^(Code)$ title:^(.*Quick Open.*)$

# Quickshell surfaces are layer-shell, not normal windows — this is a
# just-in-case fallback if one ever ends up unmanaged.
windowrule = float on class:^(quickshell)$

# cava, launched via SUPER+ALT+C (keybindings.conf) as `kitty --class cava`
windowrule = float on class:^(cava)$
windowrule = size 640 360 class:^(cava)$
windowrule = center on class:^(cava)$

# No rules here on purpose.
#
# Hyprland 0.55 removed matcher support from hyprlang `windowrule`. Verified
# on 0.55.2: `windowrule = float on, class:^(x)$` is rejected with "invalid
# field", and a bare `windowrule = float on` has no effect either.
# `windowrulev2` reports itself deprecated and also does nothing. Matching
# moved to the Lua config (see /usr/share/hypr/hyprland.lua).
#
# Everything this used to rule on is launched from a keybind, so the rules
# moved inline into those exec lines — `[float; size W H; center]` still
# works. See conf.d/keybindings.conf.
#
# Rules for windows we don't launch (Picture-in-Picture, VS Code's quick-open,
# pavucontrol) have no hyprlang equivalent any more. Left unimplemented rather
# than kept as dead lines that look like they work.

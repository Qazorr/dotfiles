# `dms run` starts both the Go backend and the Quickshell frontend.
# Absolute path: exec-once doesn't source ~/.zshrc, and the binaries live
# outside ~/.local/bin.
exec-once = $HOME/.local/share/dms/bin/dms run

# Idle/lock stays on hypridle + hyprlock. DMS ships its own lock; to use it
# instead, drop this line and bind `dms ipc call lock lock`.
exec-once = hypridle

# Points ~/.config/monitor-profiles/active.conf at the profile for the
# connected desk, then re-picks on every monitor hotplug.
exec-once = monitor-profile --watch

# Watches for screen capture and applies ~/.config/hypr/screenshare.conf while
# it lasts — blur and animations off by default, restored afterwards. Also what
# makes `screenshare status` able to answer: Hyprland has no query for this,
# only events, so without the watcher running the answer is "unknown".
exec-once = screenshare watch

# Deliberately NOT started, all superseded by DMS:
#   qs                    - DMS runs its own Quickshell instance
#   mako                  - DMS owns org.freedesktop.Notifications
#   hyprpolkitagent       - DMS registers its own polkit agent (two agents
#                           conflict: "an authentication agent already exists")
#   swww-daemon           - DMS manages the wallpaper
#   wallust-apply         - DMS themes from the wallpaper via matugen
#   nm-applet/blueman-applet - network and bluetooth live in the control centre

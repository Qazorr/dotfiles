exec-once = qs
exec-once = mako
exec-once = hypridle
exec-once = /usr/libexec/hyprpolkitagent
exec-once = $HOME/.cargo/bin/swww-daemon
exec-once = sleep 1 && $HOME/.local/bin/wallust-apply

# Register as tray icons in the Quickshell bar (no custom code needed —
# the tray already handles arbitrary StatusNotifierItems). Full GUI editors
# are also bound directly to keys below in case tray-menu interaction
# ever proves unreliable.
exec-once = nm-applet --indicator
exec-once = blueman-applet

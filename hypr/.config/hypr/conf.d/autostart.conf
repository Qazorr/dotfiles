# DankMaterialShell owns the desktop shell: bar, launcher, control centre,
# notifications, polkit agent, wallpaper and theming (matugen). `dms run`
# starts both the Go backend daemon and the Quickshell frontend.
# Absolute path because Hyprland's exec-once doesn't source ~/.zshrc, and the
# binaries live outside ~/.local/bin (that path is a stow symlink into the
# dotfiles repo — anything written there lands in git).
exec-once = $HOME/.local/share/dms/bin/dms run

# Idle/lock stays on hypridle + hyprlock (configured in ../hypridle.conf and
# ../hyprlock.conf). DMS ships its own lock; if you'd rather use it, drop this
# line and bind `dms ipc call lock lock` instead.
exec-once = hypridle

# Deliberately NOT started, all superseded by DMS:
#   qs                    - DMS runs its own Quickshell instance
#   mako                  - DMS owns org.freedesktop.Notifications
#   hyprpolkitagent       - DMS registers its own polkit agent (two agents
#                           conflict: "an authentication agent already exists")
#   swww-daemon           - DMS manages the wallpaper
#   wallust-apply         - DMS themes from the wallpaper via matugen
#   nm-applet/blueman-applet - network and bluetooth live in the control centre

input {
    # Plain `pl` is Polish (programmer's): the US layout, with ą ę ł … on AltGr.
    kb_layout = pl
    # Snappier than the 600ms / 25 per second default.
    repeat_delay = 300
    repeat_rate = 50
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Touchpad gestures, https://wiki.hypr.land/Configuring/Advanced-and-Cool/Gestures/
# 3 fingers: swipe between workspaces; up/down zooms the desktop, the same
# magnifier as SUPER+ALT+scroll in 1.5x steps.
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.5}')"
gesture = 3, down, dispatcher, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.5}')"
# 4 fingers: up opens the DMS dashboard (SUPER+A), down floats the window.
gesture = 4, up, dispatcher, exec, dms ipc call dash toggle
gesture = 4, down, float

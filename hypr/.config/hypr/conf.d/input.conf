input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Touchpad gestures (workspace swipe etc.) — not configured yet, add via
# `gesture = <fingers>, <direction>, <action>` once on real hardware to
# test against: https://wiki.hypr.land/Configuring/Advanced-and-Cool/Gestures/

general {
    gaps_in = 4
    gaps_out = 4
    border_size = 2
    col.active_border = rgb(D0BCFF) rgb(CCC2DC) 45deg
    col.inactive_border = rgb(49454E)
    layout = dwindle
    # Drag a window edge to resize, no modifier. On tiled windows this
    # moves the split; SUPER+right-drag still works anywhere.
    resize_on_border = true
    allow_tearing = false
}

dwindle {
    preserve_split = true
}

group {
    col.border_active = rgb(CCC2DC)

    groupbar {
        col.active = rgb(211F24)
    }
}

binds {
    # SUPER+<n> on the workspace you're already on jumps back to the previous
    # one, so SUPER+1 toggles 1 <-> 6 after coming from 6.
    workspace_back_and_forth = true
    # Keep toggling: without this, a workspace forgets where you came from
    # after one jump back.
    allow_workspace_cycles = true
}

misc {
    # Middle-click doesn't paste the primary selection.
    middle_click_paste = false

    # If hyprlock ever dies while locked, Hyprland's own emergency lock
    # screen takes over — this lets a relaunched hyprlock reclaim the
    # session instead of being stuck needing a TTY switch to recover.
    allow_session_lock_restore = true
}

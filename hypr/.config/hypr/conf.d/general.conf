source = $HOME/.config/hypr/wallust/colors-hyprland.conf

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $color4 $color5 45deg
    col.inactive_border = $color0
    layout = dwindle
    allow_tearing = false
}

dwindle {
    preserve_split = true
}

group {
    col.border_active = $color5

    groupbar {
        col.active = $color0
    }
}

misc {
    # If hyprlock ever dies while locked, Hyprland's own emergency lock
    # screen takes over — this lets a relaunched hyprlock reclaim the
    # session instead of being stuck needing a TTY switch to recover.
    allow_session_lock_restore = true
}

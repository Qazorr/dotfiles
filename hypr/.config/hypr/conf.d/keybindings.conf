# Keybinds, laid out after JaKooLit's Hyprland-Dots (MIT) — see README.md's
# "Key bindings" section for the arrow-key/mnemonic rationale.
#
# `bindd` not `bind`: the 4th arg is a description, exposed by
# `hyprctl binds -j` and rendered by SUPER+H (keybind-help).
#
# `[float; size W H; center]` prefixes are inline window rules on the exec
# dispatcher — Hyprland 0.55 dropped matcher support from hyprlang
# `windowrule` lines, see conf.d/windowrules.conf.

$mainMod = SUPER
$terminal = kitty
$files = nautilus
$browser = xdg-open https://
$dms = dms ipc call

# ─────────────────────────── Apps ───────────────────────────
bindd = $mainMod, Return, Open terminal, exec, $terminal
bindd = $mainMod, E, File manager, exec, $files
bindd = $mainMod, B, Open browser, exec, $browser
bindd = $mainMod, D, App launcher, exec, $dms spotlight toggle
bindd = $mainMod, A, Dashboard overview, exec, $dms dash toggle

# ───────────────────── Shell / menus (DMS) ─────────────────────
# JaKooLit binds these to rofi + their scripts; DMS covers them natively.
bindd = $mainMod, H, Help / cheat sheet, exec, [float; size 900 720; center] $terminal --class keybind-help -e keybind-help
bindd = $mainMod SHIFT, E, Control centre, exec, $dms control-center toggle
bindd = $mainMod, S, Settings, exec, $dms settings toggle
bindd = $mainMod, T, Theme switcher, exec, $dms settings toggleWith theme
bindd = $mainMod, N, Night light, exec, $dms night toggle
bindd = $mainMod SHIFT, N, Notification panel, exec, $dms notifications toggle
bindd = $mainMod ALT, V, Clipboard manager, exec, $dms clipboard toggle
bindd = $mainMod, W, Select wallpaper, exec, $dms dankdash wallpaper
bindd = $mainMod SHIFT, P, Process list, exec, $dms processlist toggle
bindd = $mainMod CTRL ALT, B, Toggle bar, exec, $dms bar toggle
bindd = $mainMod, I, Toggle idle inhibit, exec, idle-inhibit toggle
# Monitor layout/profiles: hyprmon (built from source, see bootstrap.sh).
# Its profile store (~/.config/hyprmon/profiles/) isn't in this repo —
# hardware-specific. New machine: SUPER+SHIFT+M, arrange, P to save a
# profile, then SUPER+M switches to it.
bindd = $mainMod, M, Monitor profile picker, exec, [float; size 640 400; center] $terminal -e hyprmon -profiles
bindd = $mainMod SHIFT, M, Monitor layout editor, exec, [float; size 900 600; center] $terminal -e hyprmon
bindd = $mainMod SHIFT, C, Audio visualizer (cava), exec, [float; size 640 360; center] $terminal --class cava -e cava
bindd = $mainMod ALT, N, Network manager, exec, [float; center] nm-connection-editor
bindd = $mainMod ALT, B, Bluetooth manager, exec, [float; center] blueman-manager

# Not ported (rofi-only in JaKooLit, no DMS equivalent): emoji picker,
# calculator, game mode, animations menu, rofi/oh-my-zsh theme selectors,
# waybar style/layout menus. See README.md's "What didn't port".

# ───────────────────────── Session ─────────────────────────
bindd = $mainMod, Q, Close active window, killactive
bindd = $mainMod SHIFT, Q, Exit Hyprland, exit
bindd = $mainMod, Escape, Lock screen, exec, hyprlock
bindd = $mainMod, V, Power menu, exec, $dms powermenu toggle

# ─────────────────── Window state (JaKooLit) ───────────────────
bindd = $mainMod SHIFT, F, Fullscreen, fullscreen
bindd = $mainMod CTRL, F, Maximize window, fullscreen, 1
bindd = $mainMod, SPACE, Float current window, togglefloating
bindd = $mainMod ALT, SPACE, Float all windows, exec, hyprctl dispatch workspaceopt allfloat
bindd = $mainMod, P, Toggle pseudo (dwindle), pseudo
# togglesplit is a layoutmsg in Hyprland 0.55, not a top-level dispatcher.
bindd = $mainMod SHIFT, I, Toggle split (dwindle), layoutmsg, togglesplit
bindd = $mainMod CTRL, O, Toggle window opacity, setprop, active opaque toggle

# ─────────────── Focus / move / swap / resize — ARROWS ───────────────
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d

bindd = $mainMod CTRL, left, Move window left, movewindow, l
bindd = $mainMod CTRL, right, Move window right, movewindow, r
bindd = $mainMod CTRL, up, Move window up, movewindow, u
bindd = $mainMod CTRL, down, Move window down, movewindow, d

bindd = $mainMod ALT, left, Swap window left, swapwindow, l
bindd = $mainMod ALT, right, Swap window right, swapwindow, r
bindd = $mainMod ALT, up, Swap window up, swapwindow, u
bindd = $mainMod ALT, down, Swap window down, swapwindow, d

binded = $mainMod SHIFT, left, Resize left (-50), resizeactive, -50 0
binded = $mainMod SHIFT, right, Resize right (+50), resizeactive, 50 0
binded = $mainMod SHIFT, up, Resize up (-50), resizeactive, 0 -50
binded = $mainMod SHIFT, down, Resize down (+50), resizeactive, 0 50

# ──────────────── Desktop zoom / magnifier (JaKooLit) ────────────────
bindd = $mainMod ALT, mouse_down, Zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bindd = $mainMod ALT, mouse_up, Zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# ──────────────────── Workspaces ────────────────────
# code:10-19 (physical key position) instead of literal 1-0, so this doesn't
# break on non-US keyboard layouts.
bindd = $mainMod, code:10, Workspace 1, workspace, 1
bindd = $mainMod, code:11, Workspace 2, workspace, 2
bindd = $mainMod, code:12, Workspace 3, workspace, 3
bindd = $mainMod, code:13, Workspace 4, workspace, 4
bindd = $mainMod, code:14, Workspace 5, workspace, 5
bindd = $mainMod, code:15, Workspace 6, workspace, 6
bindd = $mainMod, code:16, Workspace 7, workspace, 7
bindd = $mainMod, code:17, Workspace 8, workspace, 8
bindd = $mainMod, code:18, Workspace 9, workspace, 9
bindd = $mainMod, code:19, Workspace 10, workspace, 10

bindd = $mainMod SHIFT, code:10, Move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, code:11, Move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, code:12, Move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, code:13, Move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, code:14, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, code:15, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, code:16, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, code:17, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, code:18, Move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, code:19, Move to workspace 10, movetoworkspace, 10

bindd = $mainMod CTRL, code:10, Move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod CTRL, code:11, Move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod CTRL, code:12, Move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod CTRL, code:13, Move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod CTRL, code:14, Move silently to workspace 5, movetoworkspacesilent, 5

bindd = $mainMod, U, Toggle special workspace, togglespecialworkspace
bindd = $mainMod SHIFT, U, Move to special workspace, movetoworkspace, special

bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1

bindd = $mainMod CTRL, F9, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod CTRL, F10, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod CTRL, F11, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = $mainMod CTRL, F12, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Mouse: move/resize floating windows
bindmd = $mainMod, mouse:272, Move window (drag), movewindow
bindmd = $mainMod, mouse:273, Resize window (drag), resizewindow

# ─────────── Screenshots (Quick Capture plugin, replaces grim/slurp) ───────────
# Full annotation editor, not a raw capture — see dms/.../plugins/quickCapture.
# `edit` opens it after capture; no native delay option, so the delayed
# variants wrap the IPC call in `sleep`.
bindd = $mainMod, Print, Screenshot (full), exec, $dms quickCapture screenshot full edit
bindd = $mainMod SHIFT, Print, Screenshot (region), exec, $dms quickCapture screenshot region edit
# SUPER+SHIFT+S: alias for the line above. Not part of JaKooLit's Print-key
# scheme, but common enough elsewhere (GNOME, many other Hyprland configs)
# that it's worth having as well as, not instead of, the Print binding.
bindd = $mainMod SHIFT, S, Screenshot (region), exec, $dms quickCapture screenshot region edit
bindd = ALT, Print, Screenshot (active window), exec, $dms quickCapture screenshot window edit
bindd = $mainMod CTRL, Print, Screenshot in 5s, exec, sh -c "sleep 5 && dms ipc call quickCapture screenshot full edit"
bindd = $mainMod CTRL SHIFT, Print, Screenshot in 10s, exec, sh -c "sleep 10 && dms ipc call quickCapture screenshot full edit"

# ─────────────── Media / brightness keys ───────────────
# bindeld/bindld: repeats while held, and still works when the screen is
# locked. wpctl ships with Pipewire/WirePlumber, Debian's default audio stack.
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = ,XF86AudioMute, Toggle mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = ,XF86AudioMicMute, Toggle mic mute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl set 5%+
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
bindld = ,XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = ,XF86AudioNext, Next track, exec, playerctl next
bindld = ,XF86AudioPrev, Previous track, exec, playerctl previous

# Example two-monitor docked layout. Replace eDP-1 / DP-1 with your actual
# output names from `hyprctl monitors` — this is a template, not real yet.
#
# This file is NOT sourced by hyprland.conf directly. It's applied at
# runtime by `monitor-switch docked` (SUPER+M opens the picker), which
# reads every `monitor=` line here and pushes it live via `hyprctl keyword`.
# The `workspace=` lines only take effect on the next Hyprland reload/start.
monitor=eDP-1,preferred,0x0,1
monitor=DP-1,preferred,1920x0,1

workspace=1,monitor:eDP-1
workspace=2,monitor:eDP-1
workspace=3,monitor:DP-1
workspace=4,monitor:DP-1

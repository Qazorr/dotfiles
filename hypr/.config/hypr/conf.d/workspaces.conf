# Keep 1-5 alive even when empty, so they don't vanish from the bar.
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

# Per-workspace layout (Hyprland 0.54+). general:layout is the default;
# a layout: rule overrides it for one workspace. Built-in names are
# `dwindle` and `master` — anything else needs a plugin that registers it.
# layoutopt: sets that layout's own options, e.g.
#   workspace = 3, layout:master, layoutopt:orientation:top
# workspace = 3, layout:master

# Suggested fixed-purpose scheme (adjust to taste):
#   1 - terminal/editor    2 - browser/docs   3 - comms
#   4 - scratch            5+ - ad hoc

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0.8

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
        special = true
        popups = true
    }

    # A tight glow in the border colours (conf.d/general.conf) rather than a
    # drop shadow.
    shadow {
        enabled = true
        range = 3
        render_power = 1
        color = rgb(D0BCFF)
        color_inactive = rgb(49454E)
    }
}

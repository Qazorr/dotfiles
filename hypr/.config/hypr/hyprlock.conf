source = $HOME/.config/hypr/wallust/colors-hyprland.conf

general {
    hide_cursor = false
}

background {
    monitor =
    # Deliberately not `path = screenshot`: on at least this VM's virtio-gpu
    # it fails to create a DRM buffer, which crashes hyprlock entirely
    # rather than falling back gracefully — verified by watching it happen
    # (Hyprland's own emergency lock screen took over). A locked screen
    # must never risk becoming unlockable, so this stays a plain color.
    color = $background

    blur_size = 3
    blur_passes = 3
    noise = 0.0117
    contrast = 1.2
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color = $foreground
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $color4
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 55
    rounding = 12
    outline_thickness = 2

    outer_color = $color4
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = $foreground

    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##a6adc8">Password…</span>
    hide_input = false

    check_color = $color2
    fail_color = $color1
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -60
    halign = center
    valign = center
}

# Keyboard layout indicator
label {
    monitor =
    text = $LAYOUT
    color = rgba(166, 173, 200, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 20, 20
    halign = left
    valign = bottom
}

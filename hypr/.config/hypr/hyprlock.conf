$background = rgb(141218)
$foreground = rgb(E6E0E9)
$primary    = rgb(D0BCFF)
$success    = rgb(A6E3A1)
$error      = rgb(F2B8B5)

general {
    hide_cursor = false
}

background {
    monitor =
    color = $background

    blur_size = 3
    blur_passes = 3
    noise = 0.0117
    contrast = 1.2
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color = $foreground
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $primary
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 55
    rounding = 12
    outline_thickness = 2

    outer_color = $primary
    inner_color = rgba(33, 31, 36, 0.6)
    font_color = $foreground

    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##a6adc8">Password…</span>
    hide_input = false

    check_color = $success
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(166, 173, 200, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 20, 20
    halign = left
    valign = bottom
}

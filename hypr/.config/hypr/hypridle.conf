general {
    # Not the documented `pidof hyprlock || hyprlock`: a hyprlock that starts
    # but hangs without presenting a lock surface makes `pidof` succeed
    # forever, and the session then never locks again. lock-session checks
    # whether it is actually locking, not merely running.
    lock_cmd = lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

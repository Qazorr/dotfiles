general {
    # Not the documented `pidof hyprlock || hyprlock`: a hung hyprlock (no
    # lock surface, but still running) makes `pidof` succeed forever, so the
    # session would never lock again. lock-session checks it's actually locking.
    lock_cmd = lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

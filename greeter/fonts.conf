<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The greeter user can't see the user's font folders on its own. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir>@HOME@/.local/share/fonts</dir>
  <dir>@HOME@/.fonts</dir>
</fontconfig>
